[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "olecfrc"
version = "20260704"
description = "Object Linking and Embedding (OLE) Compound File resources (olecfrc)"
maintainers = [
    { name = "Joachim Metz", email = "joachim.metz@gmail.com" },
]
license = "Apache-2.0"
license-files = ["ACKNOWLEDGEMENTS", "AUTHORS", "LICENSE"]
readme = "README.md"
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python",
]
requires-python = ">=3.10"
dependencies = [
    "PyYAML >= 3.10",
    "dfdatetime >= 20210509",
    "dtfabric >= 20170524",
    "libolecf-python >= 20151223",
]

[project.scripts]
vba = "olecfrc.scripts.vba:Main"

[project.urls]
Homepage = "https://github.com/libyal/olecf-kb"
Repository = "https://github.com/libyal/olecf-kb"

[tool.black]
line-length = 88
target-version = ["py310"]
include = "\\.pyi?$"

[tool.docformatter]
black = true
non-cap = []
non-strict = true

[tool.l2tdevtools]
name = "Object Linking and Embedding (OLE) Compound File knowledge base (olecf-kb)"
status = "experimental"
description = """
olecfrc is a Python module part of olecf-kb to allow reuse of Object Linking \
and Embedding (OLE) Compound File resources. \
"""

[tool.setuptools]
package-dir = {"olecfrc" = "olecfrc"}

[tool.setuptools.package-data]
olecfrc = [
    "*.yaml",
]
